name: MacauTraffic
options:
  bundleIdPrefix: com.eric.macautraffic
  settingPresets: none
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    PRODUCT_NAME: $(TARGET_NAME)
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_OPTIMIZATION_LEVEL: -Onone
    ENABLE_TESTABILITY: YES
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '3'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_OPTIMIZATION_LEVEL: -O
targets:
  MacauTraffic:
    type: application
    platform: iOS
    sources:
      - path: MacauTraffic
        excludes: [Resources/Fixtures]
      - path: MacauTraffic/Resources/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        PRODUCT_BUNDLE_IDENTIFIER: com.eric.macautraffic
        INFOPLIST_KEY_CFBundleDisplayName: 澳門出行
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 按你選擇的位置功能，尋找附近車站、停車場或規劃行程。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 錄製最多 20 秒的問題，經 DeepSeek 轉成可編輯文字。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: MapKit.framework
      - sdk: JavaScriptCore.framework
      - sdk: AVKit.framework
  MacauTrafficTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MacauTraffic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eric.macautraffic.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MacauTraffic.app/MacauTraffic
        BUNDLE_LOADER: $(TEST_HOST)
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @loader_path/Frameworks
  MacauTrafficUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MacauTraffic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eric.macautraffic.uitests
        TEST_TARGET_NAME: MacauTraffic
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @loader_path/Frameworks
schemes:
  MacauTraffic:
    build:
      targets:
        MacauTraffic: all
    test:
      environmentVariables:
        MACAU_FIXTURES: '1'
      targets:
        - MacauTrafficTests
        - MacauTrafficUITests
